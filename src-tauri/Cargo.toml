[package]
name = "taskorbit"
version = "0.1.2"
description = "TaskOrbit self-hosted team workspace client"
authors = ["TaskOrbit contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "taskorbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
