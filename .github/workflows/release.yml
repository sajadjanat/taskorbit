name: Release TaskOrbit
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Package web server
        run: |
          tar -czf /tmp/taskorbit-web-server.tar.gz --exclude=./.git --exclude=./node_modules --exclude=./data --exclude=./work --exclude=./src-tauri/target --exclude=./test-results .
          mv /tmp/taskorbit-web-server.tar.gz ./taskorbit-web-server.tar.gz
      - name: Create draft prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease --title "TaskOrbit $GITHUB_REF_NAME (preview)" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" taskorbit-web-server.tar.gz --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: taskorbit-web-server
          path: taskorbit-web-server.tar.gz
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            name: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            name: macos-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: cargo test --lib --locked --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: taskorbit-${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
      - name: Attach installers
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 | while IFS= read -r -d '' file; do gh release upload "$GITHUB_REF_NAME" "$file" --clobber; done
  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android
      - run: npm ci
      - run: npx tauri android init --ci
      - name: Configure persistent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node scripts/android-signing.mjs
      - run: npx tauri android build --apk --target aarch64
      - name: Prepare APK
        run: |
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)" taskorbit-android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify taskorbit-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taskorbit-android-arm64
          path: taskorbit-android-arm64.apk
      - name: Attach APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" taskorbit-android-arm64.apk --clobber
  container:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/sajadjanat/taskorbit:${{ github.ref_name }}
  publish:
    needs: [verify, desktop, android, container]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish only after all packages succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
