name: Recover 0.1.10 Windows verification
on:
  workflow_dispatch:
    inputs:
      publish_only:
        type: boolean
        default: false
        description: Publish already verified 0.1.10 packages
permissions:
  contents: write
  actions: read
concurrency:
  group: recover-taskorbit-010
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ !inputs.publish_only }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.10
      - name: Verify immutable product source
        shell: bash
        run: test "$(git rev-parse HEAD)" = bef45b302a8696d30f01a95b0ffc0e3378ececff
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-harness
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Provision and report WebView2 runtime
        run: ./ci-harness/scripts/ensure-webview2.windows.ps1
      - run: npm ci
      - run: npm run build
      - name: Require original successful Windows compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/sajadjanat/taskorbit/actions/runs/37481743226/jobs?per_page=100' > windows-build.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const steps = JSON.parse(fs.readFileSync('windows-build.json')).jobs.find(j => j.name === 'windows').steps;
          for (const name of ['Verify immutable product source', 'Run cargo test --lib --locked --manifest-path src-tauri/Cargo.toml', 'Run npx tauri build --target x86_64-pc-windows-msvc --bundles nsis']) {
            assert.equal(steps.find(s => s.name === name)?.conclusion, 'success', name);
          }
          JS
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37481743226
          name: taskorbit-010-windows-recovery
          path: src-tauri/target/x86_64-pc-windows-msvc/release
      - name: Verify unchanged Windows product bytes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const root = 'src-tauri/target/x86_64-pc-windows-msvc/release/';
          const expected = {
            'taskorbit.exe': 'd8ff6de2eadf2ee51306f99a21fe123e137e703495bf9592242a14f41eb8291d',
            'bundle/nsis/TaskOrbit_0.1.10_x64-setup.exe': 'a7d9f67756a0fa684923f3eb183cf0b0c30110048d2d4e7f83af66ec6afcbe0e',
            'bundle/nsis/TaskOrbit_0.1.10_x64-setup.exe.sig': '0f5b4e1c4c3edd0bf8769288fef9343b42342d861c45edb874d187ab54c61940'
          };
          for (const [file, hash] of Object.entries(expected)) assert.equal(createHash('sha256').update(fs.readFileSync(root + file)).digest('hex'), hash, file);
          console.log('Executable, installer and signature match the immutable product build.');
          JS
      - name: Run actual native regression with diagnostic harness
        run: |
          Copy-Item -LiteralPath ci-harness/scripts/test-native-windows.mjs -Destination scripts/test-native-windows.mjs
          Copy-Item -LiteralPath ci-harness/scripts/native-debug-policy.windows.ps1 -Destination scripts/native-debug-policy.windows.ps1
          node scripts/test-native-windows.mjs src-tauri/target/x86_64-pc-windows-msvc/release/taskorbit.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskorbit-010-windows-recovery
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
            src-tauri/target/x86_64-pc-windows-msvc/release/taskorbit.exe
          if-no-files-found: warn
      - name: Attach verified Windows packages to existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.1.10 --json isDraft --jq .isDraft)" = true
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle -type f \( -name '*.exe' -o -name '*.sig' \) -print0 | while IFS= read -r -d '' file; do gh release upload v0.1.10 "$file" --clobber; done
  publish:
    needs: windows
    if: ${{ always() && (needs.windows.result == 'success' || (inputs.publish_only && needs.windows.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require original non-Windows verification and packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sajadjanat/taskorbit/actions/runs/37478931104 > original-run.json
          gh api 'repos/sajadjanat/taskorbit/actions/runs/37478931104/jobs?per_page=100' > original-jobs.json
          gh api 'repos/sajadjanat/taskorbit/actions/runs/37483224541/jobs?per_page=100' > native-jobs.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const run = JSON.parse(fs.readFileSync('original-run.json'));
          assert.equal(run.head_sha, 'bef45b302a8696d30f01a95b0ffc0e3378ececff');
          assert.equal(run.head_branch, 'v0.1.10');
          const jobs = JSON.parse(fs.readFileSync('original-jobs.json')).jobs;
          const names = ['verify', 'container', 'android',
            'desktop (macos-latest, x86_64-apple-darwin, app,dmg, macos-x64)',
            'desktop (macos-latest, aarch64-apple-darwin, app,dmg, macos-arm64)',
            'desktop (ubuntu-24.04, x86_64-unknown-linux-gnu, deb,appimage, linux-x64)'];
          for (const name of names) assert.equal(jobs.find(j => j.name === name)?.conclusion, 'success', name);
          const native = JSON.parse(fs.readFileSync('native-jobs.json')).jobs.find(j => j.name === 'windows');
          assert.equal(native?.conclusion, 'success', 'Actual Windows regression');
          console.log('All six original non-Windows jobs passed for the immutable release source.');
          JS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify signatures, generate manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-files
          gh release download v0.1.10 --dir release-files
          sudo apt-get update && sudo apt-get install -y minisign
          node scripts/verify-updater-signatures.mjs release-files
          GITHUB_REF_NAME=v0.1.10 node scripts/release-manifest.mjs release-files
          (cd release-files && sha256sum * > SHA256SUMS)
          gh release upload v0.1.10 release-files/latest.json release-files/SHA256SUMS --clobber
          docker buildx imagetools create --tag ghcr.io/sajadjanat/taskorbit:stable ghcr.io/sajadjanat/taskorbit:v0.1.10
          gh release edit v0.1.10 --draft=false --prerelease=false --latest
